<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[KA - CRC] TRANG CHỦ</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --orange:#FE5F00; --orange-dark:#E04F00; --navy:#0E4174; --navy-deep:#0A2F54;
    --bg:#F6F7FA; --ink:#383838; --muted:#6B6B6B; --border:#E4E8F0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:"Cambria","Times New Roman",Georgia,serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;}
  .top-line{height:3px;background:var(--orange);}
  header{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-dark) 100%);color:#fff;padding:16px clamp(20px,4vw,48px);display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:34px;width:auto;border-radius:6px;background:#fff;padding:3px;}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px;}
  header .sub{font-size:12.5px;color:#FFE4D2;font-style:italic;margin-top:2px;}

  .tabbar{display:flex;gap:2px;background:var(--navy);padding:0 clamp(20px,4vw,48px);}
  .tabbar button{font-family:inherit;background:transparent;border:none;color:#B9CBE0;padding:14px 22px;font-size:15px;font-weight:800;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;gap:8px;}
  .tabbar button.active{color:#fff;border-bottom-color:var(--orange);background:rgba(255,255,255,.06);}
  .tabbar button:hover:not(.active){color:#fff;}
  .tabbar .icon{font-size:16px;}

  .frame-wrap{position:relative;flex:1;min-height:0;}
  iframe.app-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none;}
  iframe.app-frame.active{display:block;}
</style>
</head>
<body>

<div class="top-line"></div>
<header>
  <div class="brand">
    <img src="logo.png" alt="GHN">
    <div>
      <h1>[KA - CRC] TRANG CHỦ</h1>
      <div class="sub">Đền bù · Truy thu · Báo cáo tuần &amp; tháng</div>
    </div>
  </div>
</header>
<div class="tabbar" id="tabbar">
  <button class="tab-btn" data-tab="truythu" data-src="truy_thu.html"><span class="icon">🧾</span> Truy thu</button>
  <button class="tab-btn" data-tab="report" data-src="weekly-report.html"><span class="icon">📊</span> Report tuần</button>
</div>
<div class="frame-wrap" id="frameWrap"></div>

<script>
const TABS = [
  {key:'truythu', src:'truy_thu.html'},
  {key:'report', src:'weekly-report.html'},
];
const frameWrap = document.getElementById('frameWrap');
const frames = {};

function ensureFrame(key){
  if(frames[key]) return frames[key];
  const tab = TABS.find(t=>t.key===key);
  const f = document.createElement('iframe');
  f.className = 'app-frame';
  f.setAttribute('title', tab.key);
  f.src = tab.src;
  frameWrap.appendChild(f);
  frames[key] = f;
  return f;
}

function activateTab(key){
  if(!TABS.some(t=>t.key===key)) key = TABS[0].key;
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===key));
  const f = ensureFrame(key);
  Object.keys(frames).forEach(k=> frames[k].classList.toggle('active', k===key));
  f.classList.add('active');
  const url = new URL(window.location.href);
  url.searchParams.set('tab', key);
  window.history.replaceState({}, '', url);
}

document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  activateTab(btn.dataset.tab);
});

const initialTab = new URL(window.location.href).searchParams.get('tab') || 'truythu';
activateTab(initialTab === 'truythu' || initialTab === 'report' ? initialTab : 'truythu');
</script>
</body>
</html>
