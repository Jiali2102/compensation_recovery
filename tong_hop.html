<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[KA - CRC] TỔNG HỢP ĐỀN BÙ</title>
<style>
  :root{
    --orange:#FE5F00; --orange-dark:#E04F00; --navy:#0E4174; --navy-deep:#0A2F54;
    --bg:#F6F7FA; --card:#FFFFFF; --ink:#383838; --muted:#6B6B6B; --border:#E4E8F0;
    --up:#F44336; --down:#1E88E5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Cambria","Times New Roman",Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.55;}
  #localControls{display:none;background:linear-gradient(135deg,#FF8C4B 0%,#F57A36 100%);padding:8px clamp(16px,3vw,40px);justify-content:flex-end;align-items:center;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--navy);}
  .btn:hover{background:#F0F3F8;}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
  .btn.primary:hover{background:var(--orange-dark);}
  .btn:disabled{opacity:.55;cursor:default;}
  main{max-width:1440px;margin:0 auto;padding:20px clamp(16px,3vw,40px) 60px;}

  .gate{max-width:420px;margin:70px auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:30px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center;}
  .gate .bar{width:56px;height:4px;background:var(--orange);margin:0 auto 16px;border-radius:2px;}
  .gate h2{margin:0 0 6px;font-size:18px;color:var(--navy);}
  .gate p{margin:0 0 16px;font-size:14px;color:var(--muted);}
  .gate input{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;}
  .gate .err{color:#C62828;background:#FDECEA;border-radius:6px;padding:8px;font-size:13px;margin-bottom:10px;display:none;}
  .loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:15px;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .kpi.accent{border-left-color:var(--orange);}
  .kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .kpi .value{font-size:24px;font-weight:800;color:var(--navy);margin-top:2px;}
  .kpi.accent .value{color:var(--orange);}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

  section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  section h2{font-size:16px;font-weight:800;margin:0;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;}
  section .underline{width:56px;height:3px;background:var(--orange);margin:6px 0 12px;border-radius:2px;}
  section .desc{font-size:13px;color:var(--muted);margin:0 0 10px;}
  h3{font-size:14.5px;color:var(--navy);margin:16px 0 8px;line-height:1.3;}

  .flag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
  .flag:last-child{border-bottom:none;}
  .tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;margin-top:2px;white-space:nowrap;min-width:78px;text-align:center;}
  .tag.cao{background:#FDECEA;color:#C62828;}
  .tag.tb{background:#FFF8E1;color:#B98900;}
  .tag.luu{background:#EEF1F6;color:#55627A;}
  .tag.tot{background:#E3F0FC;color:#1565C0;}
  .tag.thap{background:#EEF1F6;color:#55627A;}
  .flag .t{font-size:14px;font-weight:700;}
  .flag .d{font-size:12.5px;color:var(--muted);}
  .flag .a{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start;}
  @media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr);}}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th:first-child,td:first-child{text-align:left;white-space:normal;width:34%;}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;background:#FAFBFD;}
  .mom-up{color:var(--up);font-weight:700;}
  .mom-down{color:var(--down);font-weight:700;}
  .mom-flat{color:var(--muted);}
  .new-tag{background:#FDECEA;color:#C62828;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;}
  .sharebar{display:inline-block;height:7px;background:var(--orange);border-radius:4px;vertical-align:middle;margin-right:6px;opacity:.75;}

  .trend{display:flex;align-items:flex-end;gap:10px;height:190px;padding:10px 4px 0;}
  .trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .trend .bar{width:100%;max-width:64px;background:var(--navy);border-radius:4px 4px 0 0;min-height:2px;}
  .trend .bar.sel{background:var(--orange);}
  .trend .v{font-size:11.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;}
  .trend .l{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;}
  .trend-note{font-size:12px;color:var(--muted);margin:2px 0 6px;}

  .sug{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .sug:last-child{border-bottom:none;}
  .thr{font-size:12.5px;color:var(--muted);columns:2;column-gap:30px;}
  .thr li{margin-bottom:4px;break-inside:avoid;}
  .foot{font-size:12px;color:var(--muted);margin-top:6px;text-align:right;}
  .out-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
  .out-count{margin-right:auto;color:var(--muted);font-size:13px;}
  .out-search{font-family:inherit;font-size:13.5px;padding:7px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);min-width:260px;}
  .out-search:focus{outline:none;border-color:var(--orange);}
  table.tbl-auto{table-layout:auto;}
  table.tbl-auto th:first-child,table.tbl-auto td:first-child{width:auto;white-space:nowrap;}
  table.tbl-auto td{overflow:visible;text-overflow:clip;}

  @media print{
    body{background:#fff;}
    section{box-shadow:none;break-inside:avoid;}
    main{padding:0;}
  }
</style>
</head>
<body>

<div id="localControls"></div>
<main id="app"><div class="loading">Đang kiểm tra quyền truy cập...</div></main>

<script>
let REPORT = null;
let OUT = {list: [], count: 0, label: '', expanded: false, q: ''};
let SEL = {week: null, month: null};
let ctl = null;

const isEmbedded = (function () {
  try { return !!(window.parent && window.parent !== window && window.parent.document); } catch (e) { return false; }
})();

const CTL_CSS = `
.th-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.th-lbl{font-size:12px;color:#FFF6EF;}
.th-pick{font-family:"Cambria","Times New Roman",Georgia,serif;font-size:13px;font-weight:700;color:#E04F00;background:#fff;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;max-width:340px;}
.th-ghost{font-family:inherit;background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:12px;padding:5px 12px;border-radius:14px;cursor:pointer;}
.th-ghost:hover{background:rgba(255,255,255,0.15);}
.th-export-wrap{position:relative;display:inline-block;}
.th-export-btn{font-family:inherit;background:#0E4174;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-weight:700;font-size:13.5px;cursor:pointer;}
.th-export-btn:hover{background:#0A2F54;}
.th-export-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);overflow:hidden;min-width:170px;z-index:300;}
.th-export-menu.show{display:block;}
.th-export-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:#383838;font-family:"Cambria","Times New Roman",Georgia,serif;font-size:13.5px;padding:10px 14px;cursor:pointer;}
.th-export-menu button:hover{background:#F6F7FA;}
`;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const fmtNum = n => Math.round(n || 0).toLocaleString('vi-VN');
function fmtMoney(n) {
  n = n || 0;
  const a = Math.abs(n);
  const f = (v, u) => v.toLocaleString('vi-VN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ' + u;
  if (a >= 1e9) return f(n / 1e9, 'tỷ');
  if (a >= 1e6) return f(n / 1e6, 'triệu');
  if (a >= 1e3) return f(n / 1e3, 'nghìn');
  return fmtNum(n) + 'đ';
}
function fmtCompact(n) {
  n = n || 0;
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' tr';
  if (a >= 1e3) return (n / 1e3).toFixed(0) + ' k';
  return String(Math.round(n));
}
function momHtml(p) {
  if (p === null || p === undefined || !isFinite(p)) return '<span class="mom-flat">—</span>';
  if (p > 0.005) return '<span class="mom-up">▲ ' + p.toFixed(2) + '%</span>';
  if (p < -0.005) return '<span class="mom-down">▼ ' + Math.abs(p).toFixed(2) + '%</span>';
  return '<span class="mom-flat">0.00%</span>';
}
function deltaCell(it) {
  if (it.prev === 0 && it.cur > 0) return '<span class="new-tag">Mới</span>';
  return momHtml(it.pct);
}
function levelName(l) {
  return {cao: 'Cao', tb: 'Trung bình', luu: 'Lưu ý', tot: 'Tích cực', thap: 'Thấp'}[l] || l;
}

function ensureControls() {
  if (ctl) return ctl;
  let slot = isEmbedded ? window.parent.document.getElementById('shellControls-tonghop') : null;
  let local = false;
  if (!slot) {
    slot = document.getElementById('localControls');
    local = true;
  }
  if (!slot) return null;
  const doc = slot.ownerDocument;
  if (!doc.getElementById('shell-th-styles')) {
    const st = doc.createElement('style');
    st.id = 'shell-th-styles';
    st.textContent = CTL_CSS;
    doc.head.appendChild(st);
  }
  const mk = (tag, cls, text) => {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  slot.innerHTML = '';
  const wrap = mk('div', 'th-controls');
  const selW = mk('select', 'th-pick');
  const selM = mk('select', 'th-pick');
  const btnRefresh = mk('button', 'th-ghost', '↻ Làm mới');
  btnRefresh.type = 'button';
  btnRefresh.title = 'Tải lại dữ liệu mới nhất từ nguồn';
  const exWrap = mk('div', 'th-export-wrap');
  const exBtn = mk('button', 'th-export-btn', '⬇ Xuất ▾');
  exBtn.type = 'button';
  const exMenu = mk('div', 'th-export-menu');
  const bMd = mk('button', '', 'Markdown (.md)');
  bMd.type = 'button';
  const bPdf = mk('button', '', 'In / Lưu PDF');
  bPdf.type = 'button';
  const btnLock = mk('button', 'th-ghost', 'Khoá lại');
  btnLock.type = 'button';
  exMenu.appendChild(bMd);
  exMenu.appendChild(bPdf);
  exWrap.appendChild(exBtn);
  exWrap.appendChild(exMenu);
  wrap.appendChild(mk('span', 'th-lbl', 'Tuần'));
  wrap.appendChild(selW);
  wrap.appendChild(mk('span', 'th-lbl', 'Tháng'));
  wrap.appendChild(selM);
  wrap.appendChild(btnRefresh);
  wrap.appendChild(exWrap);
  wrap.appendChild(btnLock);
  slot.appendChild(wrap);

  const closeMenu = () => exMenu.classList.remove('show');
  selW.addEventListener('change', () => { SEL.week = selW.value; loadReport(false); });
  selM.addEventListener('change', () => { SEL.month = selM.value; loadReport(false); });
  btnRefresh.addEventListener('click', () => loadReport(true));
  exBtn.addEventListener('click', e => { e.stopPropagation(); exMenu.classList.toggle('show'); });
  bMd.addEventListener('click', () => { closeMenu(); downloadMd(); });
  bPdf.addEventListener('click', () => { closeMenu(); window.print(); });
  btnLock.addEventListener('click', lockAgain);
  if (doc.__thClose) doc.removeEventListener('click', doc.__thClose);
  doc.__thClose = closeMenu;
  doc.addEventListener('click', closeMenu);
  document.addEventListener('click', closeMenu);

  ctl = {slot, local, wrap, selW, selM, doc};
  return ctl;
}

function setControlsVisible(v) {
  const c = v ? ensureControls() : ctl;
  if (!c) return;
  c.wrap.style.display = v ? 'flex' : 'none';
  if (c.local) c.slot.style.display = v ? 'flex' : 'none';
}

function fillSelects(d) {
  const c = ensureControls();
  if (!c) return;
  const addOpt = (sel, value, text) => {
    const o = c.doc.createElement('option');
    o.value = value;
    o.textContent = text;
    sel.appendChild(o);
  };
  c.selW.innerHTML = '';
  d.periods.weeks.forEach((w, i) => addOpt(c.selW, w.key, w.label + ' · ' + w.start + ' → ' + w.end + (i === 0 ? ' (mới nhất)' : '')));
  c.selW.value = d.selected.week;
  c.selM.innerHTML = '';
  d.periods.months.forEach((m, i) => addOpt(c.selM, m.key, m.label + (i === 0 ? ' (mới nhất)' : '')));
  c.selM.value = d.selected.month;
  SEL = {week: d.selected.week, month: d.selected.month};
}

function showMessage(title, text, withReload) {
  setControlsVisible(false);
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="bar"></div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
    (withReload ? '<button class="btn primary" type="button" onclick="location.reload()">Tải lại trang</button>' : '') + '</div>';
}

function showForm(errText) {
  setControlsVisible(false);
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="bar"></div><h2>Trang giới hạn quyền xem</h2>' +
    '<p>Nhập mật khẩu để mở báo cáo tổng hợp.</p>' +
    '<div class="err" id="gateErr"></div>' +
    '<input type="password" id="gatePass" placeholder="Mật khẩu" autocomplete="current-password">' +
    '<button class="btn primary" id="gateBtn" type="button" style="width:100%;">Mở khoá</button></div>';
  const err = document.getElementById('gateErr');
  if (errText) { err.textContent = errText; err.style.display = 'block'; }
  const input = document.getElementById('gatePass');
  const btn = document.getElementById('gateBtn');
  input.focus();
  const submit = async () => {
    btn.disabled = true;
    btn.textContent = 'Đang kiểm tra...';
    try {
      const r = await fetch('/api/admin-gate', {
        method: 'POST', credentials: 'include', cache: 'no-store',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: input.value})
      });
      if (r.ok) { loadReport(false); return; }
      if (r.status === 401) { showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true); return; }
      showForm(r.status === 403 ? 'Mật khẩu không đúng.' : 'Không thể xác thực lúc này, vui lòng thử lại.');
    } catch (e) {
      showForm('Không thể kết nối máy chủ, vui lòng thử lại.');
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

async function init() {
  try {
    const r = await fetch('/api/admin-gate', {credentials: 'include', cache: 'no-store'});
    if (r.status === 401) return showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true);
    if (!r.ok) return showMessage('Không truy cập được', 'Máy chủ chưa sẵn sàng, vui lòng thử lại sau.', true);
    const g = await r.json();
    if (!g.allowed) return showMessage('Chưa được cấp quyền', 'Tài khoản của bạn chưa nằm trong danh sách được xem trang này. Vui lòng liên hệ quản trị để được cấp quyền.', false);
    if (!g.unlocked) return showForm('');
    loadReport(false);
  } catch (e) {
    showMessage('Không truy cập được', 'Không kết nối được máy chủ, vui lòng thử lại.', true);
  }
}

async function loadReport(refresh) {
  document.getElementById('app').innerHTML = '<div class="loading">Đang tổng hợp dữ liệu (có thể mất vài giây)...</div>';
  const qs = [];
  if (refresh) qs.push('refresh=1');
  if (SEL.week) qs.push('week=' + encodeURIComponent(SEL.week));
  if (SEL.month) qs.push('month=' + encodeURIComponent(SEL.month));
  try {
    const r = await fetch('/api/admin-report' + (qs.length ? '?' + qs.join('&') : ''), {credentials: 'include', cache: 'no-store'});
    if (r.status === 401) return showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true);
    if (r.status === 403) return showForm('');
    if (!r.ok) return showMessage('Không tổng hợp được dữ liệu', 'Nguồn dữ liệu đang bận hoặc chưa sẵn sàng. Bấm tải lại để thử lại.', true);
    REPORT = await r.json();
    render(REPORT);
  } catch (e) {
    showMessage('Không tổng hợp được dữ liệu', 'Không kết nối được máy chủ, vui lòng thử lại.', true);
  }
}

function dimTable(title, items, cols) {
  if (!items || !items.length) return '<div class="desc">Không có dữ liệu.</div>';
  const head = '<tr><th>' + esc(title) + '</th><th>' + esc(cols[0]) + '</th><th>' + esc(cols[1]) + '</th><th>Biến động</th><th>Tỷ trọng</th></tr>';
  const body = items.map(it =>
    '<tr><td title="' + esc(it.name) + '">' + esc(it.name) + '</td><td>' + fmtMoney(it.cur) + '</td><td>' + fmtMoney(it.prev) + '</td><td>' + deltaCell(it) +
    '</td><td><span class="sharebar" style="width:' + Math.max(2, Math.min(40, it.share * 0.4)) + 'px"></span>' + it.share.toFixed(1) + '%</td></tr>'
  ).join('');
  return '<div class="table-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function block(title, items, cols) {
  return '<div><h3>' + esc(title) + '</h3>' + dimTable(title, items, cols) + '</div>';
}

function pairRow(a, b) {
  return '<div class="grid2">' + a + (b || '<div></div>') + '</div>';
}

function trendBars(list, note) {
  const max = Math.max.apply(null, list.map(x => x.den).concat([1]));
  return '<div class="trend">' + list.map(x =>
    '<div class="col" title="' + esc(x.label + (x.start ? ': ' + x.start + ' → ' + x.end : '')) + '"><div class="v">' + esc(fmtCompact(x.den)) + '</div><div class="bar' + (x.selected ? ' sel' : '') +
    '" style="height:' + Math.max(2, Math.round(x.den / max * 130)) + 'px"></div><div class="l">' + esc(x.label.replace('-20', '-')) + '</div></div>'
  ).join('') + '</div><div class="trend-note">' + esc(note) + '</div>';
}

function dimGrid(dims, cols, rows) {
  return rows.map(r => pairRow(block(r[0][1], dims[r[0][0]], cols), r[1] ? block(r[1][1], dims[r[1][0]], cols) : '')).join('');
}

function render(d) {
  if (d.empty) {
    setControlsVisible(false);
    document.getElementById('app').innerHTML = '<div class="loading">Nguồn dữ liệu chưa có dòng nào để tổng hợp.</div>';
    return;
  }
  fillSelects(d);
  setControlsVisible(true);
  const w = d.week, m = d.month, th = d.thresholds;

  const avgPer = (cur, n) => n ? fmtMoney(cur / n) : '—';
  const kpis =
    '<div class="kpis">' +
    '<div class="kpi accent"><div class="label">Đền bù ' + esc(w.label) + '</div><div class="value">' + fmtMoney(w.total.cur) +
      '</div><div class="sub">' + momHtml(w.total.pct) + ' so với ' + esc(w.total.prevLabel) + ' (' + fmtMoney(w.total.prev) + ')</div></div>' +
    '<div class="kpi"><div class="label">Số đơn ' + esc(w.label) + '</div><div class="value">' + fmtNum(w.total.n) +
      '</div><div class="sub">Giá trị trung bình ' + avgPer(w.total.cur, w.total.n) + ' / đơn</div></div>' +
    '<div class="kpi"><div class="label">Trung bình 4 tuần trước</div><div class="value">' + fmtMoney(w.total.avg4) +

function mdTable(headers, rows) {
  if (!rows.length) return '';
  return '| ' + headers.join(' | ') + ' |\n|' + headers.map(() => '---').join('|') + '|\n' +
    rows.map(r => '| ' + r.map(c => String(c).replace(/\|/g, '/')).join(' | ') + ' |').join('\n') + '\n\n';
}
function mdPct(p, it) {
  if (it && it.prev === 0 && it.cur > 0) return 'Mới';
  if (p === null || p === undefined || !isFinite(p)) return '—';
  return (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p).toFixed(2) + '%';
}
function mdDim(title, items, cols) {
  return mdTable([title, cols[0], cols[1], 'Biến động', 'Tỷ trọng'],
    (items || []).map(it => [it.name, fmtMoney(it.cur), fmtMoney(it.prev), mdPct(it.pct, it), it.share.toFixed(1) + '%']));
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function outFileName(ext) {

}

function downloadOutliersCsv() {
  const list = outFiltered();
  if (!list.length) return;
  const cell = v => {
    const t = String(v === null || v === undefined ? '' : v);
    return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const lines = [OUT_COLS.map(c => cell(c[0])).join(',')];
  list.forEach(x => lines.push(OUT_COLS.map(c => cell(x[c[1]])).join(',')));
  saveBlob(new Blob(['\uFEFF' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), outFileName('csv'));
}

const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((s, b) => s + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xmlText(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function colLetter(i) {
  let s = '';
  i += 1;
  while (i > 0) {
    const m = (i - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function buildXlsx(list) {
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const lastCol = colLetter(OUT_COLS.length - 1);
  let rows = '<row r="1">' + OUT_COLS.map((c, i) => '<c r="' + colLetter(i) + '1" s="1" t="inlineStr"><is><t>' + xmlText(c[0]) + '</t></is></c>').join('') + '</row>';
  list.forEach((x, r) => {
    const rn = r + 2;
    rows += '<row r="' + rn + '">' + OUT_COLS.map((c, i) => {
      const ref = colLetter(i) + rn;
      if (c[1] === 'den') return '<c r="' + ref + '" s="2"><v>' + (Number(x.den) || 0) + '</v></c>';
      return '<c r="' + ref + '" t="inlineStr"><is><t>' + xmlText(x[c[1]]) + '</t></is></c>';
    }).join('') + '</row>';
  });
  const sheet = head + '<worksheet xmlns="' + ns + '"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols>' + OUT_COLS.map((c, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c[2] + '" customWidth="1"/>').join('') + '</cols>' +
    '<sheetData>' + rows + '</sheetData><autoFilter ref="A1:' + lastCol + (list.length + 1) + '"/></worksheet>';
  const styles = head + '<styleSheet xmlns="' + ns + '"><fonts count="2"><font><sz val="11"/><name val="Cambria"/></font><font><b/><sz val="11"/><name val="Cambria"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const rel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return zipStore([
    {name: '[Content_Types].xml', text: head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name: '_rels/.rels', text: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + rel + '/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name: 'xl/workbook.xml', text: head + '<workbook xmlns="' + ns + '" xmlns:r="' + rel + '"><sheets><sheet name="Đơn bất thường" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name: 'xl/_rels/workbook.xml.rels', text: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + rel + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + rel + '/styles" Target="styles.xml"/></Relationships>'},
    {name: 'xl/styles.xml', text: styles},
    {name: 'xl/worksheets/sheet1.xml', text: sheet}
  ]);
}

function downloadOutliersXlsx() {
  const list = outFiltered();
  if (!list.length) return;
  saveBlob(buildXlsx(list), outFileName('xlsx'));
}

function downloadMd() {
  if (!REPORT || REPORT.empty) return;
  const blob = new Blob([buildMarkdown(REPORT)], {type: 'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TongHop_DenBu_' + REPORT.week.label + '_' + REPORT.month.label.replace('/', '-') + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function lockAgain() {
  try {
    await fetch('/api/admin-gate', {
      method: 'POST', credentials: 'include', cache: 'no-store',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'lock'})
    });
  } catch (e) {}
  REPORT = null;
  SEL = {week: null, month: null};
  showForm('');
}
