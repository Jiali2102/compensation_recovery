<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[KA - CRC] TỔNG HỢP ĐỀN BÙ</title>
<style>
  :root{
    --orange:#FE5F00; --orange-dark:#E04F00; --navy:#0E4174; --navy-deep:#0A2F54;
    --bg:#F6F7FA; --card:#FFFFFF; --ink:#383838; --muted:#6B6B6B; --border:#E4E8F0;
    --up:#F44336; --down:#1E88E5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Cambria","Times New Roman",Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.55;}
  #localControls{display:none;background:linear-gradient(135deg,#FF8C4B 0%,#F57A36 100%);padding:8px clamp(16px,3vw,40px);justify-content:flex-end;align-items:center;}
  .btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--navy);}
  .btn:hover{background:#F0F3F8;}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
  .btn.primary:hover{background:var(--orange-dark);}
  .btn:disabled{opacity:.55;cursor:default;}
  main{max-width:1440px;margin:0 auto;padding:20px clamp(16px,3vw,40px) 60px;}

  .gate{max-width:420px;margin:70px auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:30px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center;}
  .gate .bar{width:56px;height:4px;background:var(--orange);margin:0 auto 16px;border-radius:2px;}
  .gate h2{margin:0 0 6px;font-size:18px;color:var(--navy);}
  .gate p{margin:0 0 16px;font-size:14px;color:var(--muted);}
  .gate input{width:100%;font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;}
  .gate .err{color:#C62828;background:#FDECEA;border-radius:6px;padding:8px;font-size:13px;margin-bottom:10px;display:none;}
  .loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:15px;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:20px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  .kpi.accent{border-left-color:var(--orange);}
  .kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .kpi .value{font-size:24px;font-weight:800;color:var(--navy);margin-top:2px;}
  .kpi.accent .value{color:var(--orange);}
  .kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px;}

  section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
  section h2{font-size:16px;font-weight:800;margin:0;color:var(--orange);text-transform:uppercase;letter-spacing:.4px;}
  section .underline{width:56px;height:3px;background:var(--orange);margin:6px 0 12px;border-radius:2px;}
  section .desc{font-size:13px;color:var(--muted);margin:0 0 10px;}
  h3{font-size:14.5px;color:var(--navy);margin:16px 0 8px;line-height:1.3;}

  .flag{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);}
  .flag:last-child{border-bottom:none;}
  .tag{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;margin-top:2px;white-space:nowrap;min-width:78px;text-align:center;}
  .tag.cao{background:#FDECEA;color:#C62828;}
  .tag.tb{background:#FFF8E1;color:#B98900;}
  .tag.luu{background:#EEF1F6;color:#55627A;}
  .tag.tot{background:#E3F0FC;color:#1565C0;}
  .tag.thap{background:#EEF1F6;color:#55627A;}
  .flag .t{font-size:14px;font-weight:700;}
  .flag .d{font-size:12.5px;color:var(--muted);}
  .flag .a{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start;}
  @media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr);}}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
  th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  th:first-child,td:first-child{text-align:left;white-space:normal;width:34%;}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;background:#FAFBFD;}
  .mom-up{color:var(--up);font-weight:700;}
  .mom-down{color:var(--down);font-weight:700;}
  .mom-flat{color:var(--muted);}
  .new-tag{background:#FDECEA;color:#C62828;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;}
  .sharebar{display:inline-block;height:7px;background:var(--orange);border-radius:4px;vertical-align:middle;margin-right:6px;opacity:.75;}

  .trend{display:flex;align-items:flex-end;gap:10px;height:190px;padding:10px 4px 0;}
  .trend .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;}
  .trend .bar{width:100%;max-width:64px;background:var(--navy);border-radius:4px 4px 0 0;min-height:2px;}
  .trend .bar.sel{background:var(--orange);}
  .trend .v{font-size:11.5px;font-weight:700;margin-bottom:3px;white-space:nowrap;}
  .trend .l{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;}
  .trend-note{font-size:12px;color:var(--muted);margin:2px 0 6px;}

  .sug{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .sug:last-child{border-bottom:none;}
  .thr{font-size:12.5px;color:var(--muted);columns:2;column-gap:30px;}
  .thr li{margin-bottom:4px;break-inside:avoid;}
  .foot{font-size:12px;color:var(--muted);margin-top:6px;text-align:right;}
  .out-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px;}
  .out-count{margin-right:auto;color:var(--muted);font-size:13px;}
  .out-search{font-family:inherit;font-size:13.5px;padding:7px 11px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);min-width:260px;}
  .out-search:focus{outline:none;border-color:var(--orange);}
  table.tbl-auto{table-layout:auto;}
  table.tbl-auto th:first-child,table.tbl-auto td:first-child{width:auto;white-space:nowrap;}
  table.tbl-auto td{overflow:visible;text-overflow:clip;}

  .vtabs{position:sticky;top:0;z-index:60;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:10px 0;background:var(--bg);box-shadow:0 8px 8px -8px rgba(0,0,0,.18);}
  .vjump{display:none;gap:6px;flex-wrap:wrap;margin-left:12px;padding-left:14px;border-left:2px solid var(--border);}
  .vjump.show{display:flex;}
  .vjump button{font-family:inherit;font-weight:700;font-size:12.5px;border-radius:6px;padding:5px 10px;border:1px solid var(--border);background:#fff;color:var(--navy);cursor:pointer;}
  .vjump button:hover{border-color:var(--orange);color:var(--orange-dark);}
  section{scroll-margin-top:64px;}
  .txtl{text-align:left;}
  .warn-toggle{font-family:inherit;background:var(--bg);border:1px solid var(--border);border-radius:4px;width:20px;height:20px;line-height:1;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;margin-right:6px;padding:0;}
  .warn-toggle:hover{background:#EAEDF3;}
  tr.sub-row td{background:#FFF3EA;}
  tr.sub-row td:first-child{border-left:4px solid var(--orange);padding-left:22px;}
  tr.sub-head td{background:#FDE4CC;color:var(--orange-dark);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.3px;text-align:left;}
  tr.sub-row td.cur{background:#FFE0B8;}
  .vtab{font-family:inherit;font-weight:700;font-size:13.5px;border-radius:999px;padding:7px 18px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;}
  .vtab:hover{border-color:var(--orange);color:var(--orange-dark);}
  .vtab.active{background:var(--orange);border-color:var(--orange);color:#fff;}
  .vtab-ghost{font-family:inherit;font-weight:700;font-size:13.5px;border-radius:999px;padding:7px 18px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;}
  .vtab-ghost:hover{border-color:var(--orange);color:var(--orange-dark);}
  .in-fbtn{position:relative;font-family:inherit;font-size:12.5px;text-align:left;border:1px solid var(--border);background:#fff;color:var(--navy);border-radius:8px;padding:7px 28px 7px 11px;cursor:pointer;max-width:220px;}
  .in-fbtn .in-k{color:var(--muted);font-weight:700;margin-right:4px;}
  .in-fbtn .v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;max-width:140px;vertical-align:bottom;}
  .in-fbtn .v.all{color:var(--muted);font-weight:400;}
  .in-fbtn .in-count{background:var(--orange);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px;margin-left:5px;}
  .in-fbtn .in-car{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:10px;}
  .in-fbtn.open,.in-fbtn:hover{border-color:var(--orange);}
  .in-panel{position:absolute;top:calc(100% + 6px);left:0;width:280px;z-index:40;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:10px;display:none;}
  .in-panel.show{display:block;}
  .in-panel input[type=search]{width:100%;font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;color:var(--navy);background:#fafafa;margin-bottom:8px;box-sizing:border-box;}
  .in-quick{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px;}
  .in-quick a{color:var(--orange-dark);cursor:pointer;font-weight:700;text-decoration:none;}
  .in-quick a:hover{text-decoration:underline;}
  .in-list{max-height:220px;overflow-y:auto;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:8px;}
  .in-row{display:flex;align-items:flex-start;gap:7px;padding:5px 3px;font-size:12.5px;cursor:pointer;border-radius:5px;}
  .in-row:hover{background:#f7f7f7;}
  .in-row input{margin-top:2px;}
  .in-name{flex:1;line-height:1.3;}
  .in-meta{color:var(--muted);font-size:10.5px;display:block;}
  .in-empty{color:var(--muted);font-size:12px;padding:10px 4px;text-align:center;}
  .in-foot{display:flex;justify-content:flex-end;gap:6px;}
  .in-foot button{font-family:inherit;font-size:12px;font-weight:700;border-radius:6px;padding:6px 12px;cursor:pointer;}
  .in-ok{background:var(--orange);border:1px solid var(--orange);color:#fff;}
  .in-cancel{background:#fff;border:1px solid var(--border);color:var(--navy);}
  .in-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
  .in-kpi{border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
  .in-kpi .l{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
  .in-kpi .v{font-size:19px;font-weight:800;color:var(--navy);}
  .in-kpi .v.orange{color:var(--orange-dark);}
  .in-trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding:0 4px;margin-bottom:6px;overflow-x:auto;}
  .in-trend .col{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .in-trend .bar{width:100%;max-width:34px;background:var(--orange);border-radius:4px 4px 0 0;}
  .in-trend .val{font-size:10px;color:var(--muted);white-space:nowrap;}
  .in-trend .lab{font-size:10.5px;color:var(--navy);font-weight:700;white-space:nowrap;}
  .in-ranklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:20px;}
  .in-rankcol .t{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
  .in-rankrow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px;}
  .in-rankrow .nm{width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .in-rankrow .bar{flex:1;background:#FFF3EC;border-radius:4px;height:14px;position:relative;}
  .in-rankrow .bar i{display:block;height:100%;background:var(--orange);border-radius:4px;}
  .in-rankrow .vv{width:80px;text-align:right;color:var(--muted);font-size:10.5px;flex-shrink:0;}
  .view.hide{display:none;}
  table.tbl-heat{table-layout:auto;}
  table.tbl-heat th:first-child,table.tbl-heat td:first-child{width:auto;min-width:190px;max-width:300px;white-space:normal;}
  table.tbl-heat td{overflow:visible;text-overflow:clip;}
  th.cur,td.cur{background:#FFF3CD;}
  .h1c{background:rgba(254,95,0,.08);}
  .h2c{background:rgba(254,95,0,.18);}
  .h3c{background:rgba(254,95,0,.30);}
  .h4c{background:rgba(254,95,0,.45);font-weight:700;}
  .mutedv{color:#9AA3B5;}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:#FDECEA;color:#C62828;margin-left:6px;white-space:nowrap;}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:#FDECEA;color:#C62828;white-space:nowrap;}
  .badge.warn{background:#FFF8E1;color:#B98900;}
  .sec-note{margin-top:12px;padding:10px 14px;border-left:4px solid var(--navy);background:#F3F6FB;border-radius:6px;font-size:13.5px;}
  @media print{
    body{background:#fff;}
    section{box-shadow:none;break-inside:avoid;}
    main{padding:0;}
    .view.hide{display:block;}
    .vtabs{display:none;}
  }
</style>
<script src="data-client.js"></script>
</head>
<body>

<div id="localControls"></div>
<main id="app"><div class="loading">Đang kiểm tra quyền truy cập...</div></main>

<script>
let REPORT = null;
let OUT = {list: [], count: 0, label: '', expanded: false, q: ''};
let VIEW = 'tq';
let BASIS = null;
let SEL = {week: null, month: null};
let ctl = null;

function pickData(basis) {
  if (!REPORT) return null;
  return basis === 'hen_lay' ? REPORT.henLay : REPORT;
}

const isEmbedded = (function () {
  try { return !!(window.parent && window.parent !== window && window.parent.document); } catch (e) { return false; }
})();

const CTL_CSS = `
.th-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.th-lbl{font-size:12px;color:#FFF6EF;}
.th-pick{font-family:"Cambria","Times New Roman",Georgia,serif;font-size:13px;font-weight:700;color:#E04F00;background:#fff;border:none;border-radius:6px;padding:6px 8px;cursor:pointer;max-width:420px;}
.th-ghost{font-family:inherit;background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:12px;padding:5px 12px;border-radius:14px;cursor:pointer;}
.th-ghost:hover{background:rgba(255,255,255,0.15);}
.th-export-wrap{position:relative;display:inline-block;}
.th-export-btn{font-family:inherit;background:#0E4174;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-weight:700;font-size:13.5px;cursor:pointer;}
.th-export-btn:hover{background:#0A2F54;}
.th-export-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);overflow:hidden;min-width:170px;z-index:300;}
.th-export-menu.show{display:block;}
.th-export-menu button{display:block;width:100%;text-align:left;background:transparent;border:none;color:#383838;font-family:"Cambria","Times New Roman",Georgia,serif;font-size:13.5px;padding:10px 14px;cursor:pointer;}
.th-export-menu button:hover{background:#F6F7FA;}
`;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const fmtNum = n => Math.round(n || 0).toLocaleString('vi-VN');
function fmtMoney(n) {
  n = n || 0;
  const a = Math.abs(n);
  const f = (v, u) => v.toLocaleString('vi-VN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ' + u;
  if (a >= 1e9) return f(n / 1e9, 'tỷ');
  if (a >= 1e6) return f(n / 1e6, 'triệu');
  if (a >= 1e3) return f(n / 1e3, 'nghìn');
  return fmtNum(n) + 'đ';
}
function fmtCompact(n) {
  n = n || 0;
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace('.', ',') + ' tỷ';
  if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' tr';
  if (a >= 1e3) return (n / 1e3).toFixed(0) + ' k';
  return String(Math.round(n));
}
function momHtml(p) {
  if (p === null || p === undefined || !isFinite(p)) return '<span class="mom-flat">—</span>';
  if (p > 0.005) return '<span class="mom-up">▲ ' + p.toFixed(2) + '%</span>';
  if (p < -0.005) return '<span class="mom-down">▼ ' + Math.abs(p).toFixed(2) + '%</span>';
  return '<span class="mom-flat">0.00%</span>';
}
function deltaCell(it) {
  if (it.prev === 0 && it.cur > 0) return '<span class="new-tag">Mới</span>';
  return momHtml(it.pct);
}
function levelName(l) {
  return {cao: 'Cao', tb: 'Trung bình', luu: 'Lưu ý', tot: 'Tích cực', thap: 'Thấp'}[l] || l;
}

function ensureControls() {
  if (ctl) return ctl;
  let slot = isEmbedded ? window.parent.document.getElementById('shellControls-tonghop') : null;
  let local = false;
  if (!slot) {
    slot = document.getElementById('localControls');
    local = true;
  }
  if (!slot) return null;
  const doc = slot.ownerDocument;
  if (!doc.getElementById('shell-th-styles')) {
    const st = doc.createElement('style');
    st.id = 'shell-th-styles';
    st.textContent = CTL_CSS;
    doc.head.appendChild(st);
  }
  const mk = (tag, cls, text) => {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  slot.innerHTML = '';
  const wrap = mk('div', 'th-controls');
  const selW = mk('select', 'th-pick');
  const selM = mk('select', 'th-pick');
  const btnRefresh = mk('button', 'th-ghost', '↻ Làm mới');
  btnRefresh.type = 'button';
  btnRefresh.title = 'Tải lại dữ liệu mới nhất từ nguồn';
  const exWrap = mk('div', 'th-export-wrap');
  const exBtn = mk('button', 'th-export-btn', '⬇ Xuất ▾');
  exBtn.type = 'button';
  const exMenu = mk('div', 'th-export-menu');
  const bMd = mk('button', '', 'Markdown (.md)');
  bMd.type = 'button';
  const bPdf = mk('button', '', 'In / Lưu PDF');
  bPdf.type = 'button';
  const btnLock = mk('button', 'th-ghost', 'Khoá lại');
  btnLock.type = 'button';
  exMenu.appendChild(bMd);
  exMenu.appendChild(bPdf);
  exWrap.appendChild(exBtn);
  exWrap.appendChild(exMenu);
  wrap.appendChild(mk('span', 'th-lbl', 'Tuần'));
  wrap.appendChild(selW);
  wrap.appendChild(mk('span', 'th-lbl', 'Tháng'));
  wrap.appendChild(selM);
  wrap.appendChild(btnRefresh);
  wrap.appendChild(exWrap);
  wrap.appendChild(btnLock);
  slot.appendChild(wrap);

  const closeMenu = () => exMenu.classList.remove('show');
  selW.addEventListener('change', () => { SEL.week = selW.value; loadReport(false); });
  selM.addEventListener('change', () => { SEL.month = selM.value; loadReport(false); });
  btnRefresh.addEventListener('click', () => loadReport(true));
  exBtn.addEventListener('click', e => { e.stopPropagation(); exMenu.classList.toggle('show'); });
  bMd.addEventListener('click', () => { closeMenu(); downloadMd(); });
  bPdf.addEventListener('click', () => { closeMenu(); window.print(); });
  btnLock.addEventListener('click', lockAgain);
  if (doc.__thClose) doc.removeEventListener('click', doc.__thClose);
  doc.__thClose = closeMenu;
  doc.addEventListener('click', closeMenu);
  document.addEventListener('click', closeMenu);

  ctl = {slot, local, wrap, selW, selM, doc};
  return ctl;
}

function setControlsVisible(v) {
  const c = v ? ensureControls() : ctl;
  if (!c) return;
  c.wrap.style.display = v ? 'flex' : 'none';
  if (c.local) c.slot.style.display = v ? 'flex' : 'none';
}

function fillSelects(d) {
  const c = ensureControls();
  if (!c) return;
  const addOpt = (sel, value, text) => {
    const o = c.doc.createElement('option');
    o.value = value;
    o.textContent = text;
    sel.appendChild(o);
  };
  c.selW.innerHTML = '';
  const isHLSel = BASIS === 'hen_lay';
  d.periods.weeks.forEach((w, i) => addOpt(c.selW, w.key, w.label + ' · ' + w.start + ' → ' + w.end + (isHLSel ? '' : ' · duyệt ' + w.approveFrom) + (i === 0 ? ' (mới nhất)' : '')));
  c.selW.value = d.selected.week;
  c.selM.innerHTML = '';
  d.periods.months.forEach((m, i) => addOpt(c.selM, m.key, m.label + (i === 0 ? ' (mới nhất)' : '')));
  c.selM.value = d.selected.month;
  SEL = {week: d.selected.week, month: d.selected.month};
}

function showMessage(title, text, withReload) {
  setControlsVisible(false);
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="bar"></div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
    (withReload ? '<button class="btn primary" type="button" onclick="location.reload()">Tải lại trang</button>' : '') + '</div>';
}

function showForm(errText) {
  setControlsVisible(false);
  document.getElementById('app').innerHTML =
    '<div class="gate"><div class="bar"></div><h2>Trang giới hạn quyền xem</h2>' +
    '<p>Nhập mật khẩu để mở báo cáo tổng hợp.</p>' +
    '<div class="err" id="gateErr"></div>' +
    '<input type="password" id="gatePass" placeholder="Mật khẩu" autocomplete="current-password">' +
    '<button class="btn primary" id="gateBtn" type="button" style="width:100%;">Mở khoá</button></div>';
  const err = document.getElementById('gateErr');
  if (errText) { err.textContent = errText; err.style.display = 'block'; }
  const input = document.getElementById('gatePass');
  const btn = document.getElementById('gateBtn');
  input.focus();
  const submit = async () => {
    btn.disabled = true;
    btn.textContent = 'Đang kiểm tra...';
    try {
      const r = await fetch('/api/admin-gate', {
        method: 'POST', credentials: 'include', cache: 'no-store',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: input.value})
      });
      if (r.ok) { showBasisChooser(); return; }
      if (r.status === 401) { showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true); return; }
      showForm(r.status === 403 ? 'Mật khẩu không đúng.' : 'Không thể xác thực lúc này, vui lòng thử lại.');
    } catch (e) {
      showForm('Không thể kết nối máy chủ, vui lòng thử lại.');
    }
  };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

async function init() {
  try {
    const r = await fetch('/api/admin-gate', {credentials: 'include', cache: 'no-store'});
    if (r.status === 401) return showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true);
    if (!r.ok) return showMessage('Không truy cập được', 'Máy chủ chưa sẵn sàng, vui lòng thử lại sau.', true);
    const g = await r.json();
    if (!g.allowed) return showMessage('Chưa được cấp quyền', 'Tài khoản của bạn chưa nằm trong danh sách được xem trang này. Vui lòng liên hệ quản trị để được cấp quyền.', false);
    if (!g.unlocked) return showForm('');
    showBasisChooser();
  } catch (e) {
    showMessage('Không truy cập được', 'Không kết nối được máy chủ, vui lòng thử lại.', true);
  }
}

function showBasisChooser() {
  setControlsVisible(false);
  document.getElementById('app').innerHTML =
    '<div class="gate" style="max-width:560px;"><div class="bar"></div><h2>Xem tổng hợp đền bù theo mốc thời gian nào?</h2>' +
    '<p>Chọn mốc thời gian dùng để tính tuần và tháng cho báo cáo. Có thể đổi lại bất cứ lúc nào.</p>' +
    '<button class="btn primary" type="button" id="bcEform" style="width:100%;margin-bottom:10px;padding:12px;">Theo ngày duyệt eform<br><span style="font-weight:400;font-size:12px;">Tuần tính thứ 4 → thứ 3, như hiện tại</span></button>' +
    '<button class="btn" type="button" id="bcHenLay" style="width:100%;padding:12px;">Theo ngày hẹn lấy<br><span style="font-weight:400;font-size:12px;">Tuần tính thứ 2 → Chủ nhật, theo cột thoi_gian_hen_lay</span></button></div>';
  document.getElementById('bcEform').addEventListener('click', () => chooseBasis('eform'));
  document.getElementById('bcHenLay').addEventListener('click', () => chooseBasis('hen_lay'));
}

function chooseBasis(basis) {
  BASIS = basis;
  SEL = {week: null, month: null};
  if (REPORT) {
    render(pickData(basis), basis);
  } else {
    loadReport(false);
  }
}

async function loadReport(refresh) {
  document.getElementById('app').innerHTML = '<div class="loading">Đang tổng hợp dữ liệu (có thể mất vài giây)...</div>';
  const qs = [];
  if (refresh) qs.push('refresh=1');
  if (BASIS === 'hen_lay') {
    if (SEL.week) qs.push('hlWeek=' + encodeURIComponent(SEL.week));
    if (SEL.month) qs.push('hlMonth=' + encodeURIComponent(SEL.month));
  } else {
    if (SEL.week) qs.push('week=' + encodeURIComponent(SEL.week));
    if (SEL.month) qs.push('month=' + encodeURIComponent(SEL.month));
  }
  try {
    const crf = (window.CRData && window.CRData.fetch) || ((window.top && window.top.CRData && window.top.CRData.fetch)) || fetch;
    const r = await crf('/api/admin-report' + (qs.length ? '?' + qs.join('&') : ''), {credentials: 'include', cache: 'no-store'});
    if (r.status === 401) return showMessage('Phiên đăng nhập đã hết hạn', 'Vui lòng tải lại trang và đăng nhập lại.', true);
    if (r.status === 403) return showForm('');
    if (!r.ok) return showMessage('Không tổng hợp được dữ liệu', 'Nguồn dữ liệu đang bận hoặc chưa sẵn sàng. Bấm tải lại để thử lại.', true);
    REPORT = await r.json();
    render(pickData(BASIS), BASIS);
  } catch (e) {
    showMessage('Không tổng hợp được dữ liệu', 'Không kết nối được máy chủ, vui lòng thử lại.', true);
  }
}

function dimTable(title, items, cols) {
  if (!items || !items.length) return '<div class="desc">Không có dữ liệu.</div>';
  const head = '<tr><th>' + esc(title) + '</th><th>' + esc(cols[0]) + '</th><th>' + esc(cols[1]) + '</th><th>Biến động</th><th>Tỷ trọng</th></tr>';
  const body = items.map(it =>
    '<tr><td title="' + esc(it.name) + '">' + esc(it.name) + '</td><td>' + fmtMoney(it.cur) + '</td><td>' + fmtMoney(it.prev) + '</td><td>' + deltaCell(it) +
    '</td><td><span class="sharebar" style="width:' + Math.max(2, Math.min(40, it.share * 0.4)) + 'px"></span>' + it.share.toFixed(1) + '%</td></tr>'
  ).join('');
  return '<div class="table-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function block(title, items, cols) {
  return '<div><h3>' + esc(title) + '</h3>' + dimTable(title, items, cols) + '</div>';
}

function pairRow(a, b) {
  return '<div class="grid2">' + a + (b || '<div></div>') + '</div>';
}

function trendBars(list, note) {
  const max = Math.max.apply(null, list.map(x => x.den).concat([1]));
  return '<div class="trend">' + list.map(x =>
    '<div class="col" title="' + esc(x.label + (x.start ? ': ' + x.start + ' → ' + x.end : '')) + '"><div class="v">' + esc(fmtCompact(x.den)) + '</div><div class="bar' + (x.selected ? ' sel' : '') +
    '" style="height:' + Math.max(2, Math.round(x.den / max * 130)) + 'px"></div><div class="l">' + esc(x.label.replace('-20', '-')) + '</div></div>'
  ).join('') + '</div><div class="trend-note">' + esc(note) + '</div>';
}

function dimGrid(dims, cols, rows) {
  return rows.map(r => pairRow(block(r[0][1], dims[r[0][0]], cols), r[1] ? block(r[1][1], dims[r[1][0]], cols) : '')).join('');
}

const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('vi-VN', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const mil = v => v > 0 ? (v / 1e6).toLocaleString('vi-VN', {minimumFractionDigits: 1, maximumFractionDigits: 1}) : '—';

function heatClass(v, max) {
  if (!v || !max) return '';
  const r = v / max;
  return r >= 0.8 ? 'h4c' : r >= 0.55 ? 'h3c' : r >= 0.3 ? 'h2c' : r >= 0.12 ? 'h1c' : '';
}

function deltaDays(p) {
  if (p === null || p === undefined || !isFinite(p)) return '<span class="mom-flat">—</span>';
  if (p > 0.05) return '<span class="mom-up">▲ +' + fmt1(p) + ' ngày</span>';
  if (p < -0.05) return '<span class="mom-down">▼ ' + fmt1(Math.abs(p)) + ' ngày</span>';
  return '<span class="mom-flat">0,0 ngày</span>';
}

function sellersSection(d, sfx) {
  sfx = sfx || '';
  const sl = d.deep.sellers, w = d.week, th = d.thresholds;
  if (!sl.rows.length) return '';
  const rows = sl.rows.map(r => {
    const flag = r.flag === 'surge' ? '<span class="badge">Tăng đột biến</span>' : r.flag === 'new' ? '<span class="badge warn">Mới phát sinh</span>' : '';
    const cmp = r.pct === null ? '<span class="new-tag">Mới</span>' : momHtml(r.pct);
    return '<tr><td title="' + esc(r.name) + '">' + esc(r.name) + '</td><td>' + esc(r.acc) + '</td><td>' + fmtNum(r.n) + '</td><td>' + fmtMoney(r.cur) +
      '</td><td><span class="sharebar" style="width:' + Math.max(2, Math.min(60, r.share * 4)) + 'px"></span>' + r.share.toFixed(2) + '%</td><td>' + r.cum.toFixed(2) + '%</td><td>' + cmp + '</td><td>' + flag + '</td></tr>';
  }).join('');
  const hot = sl.rows.filter(r => r.flag === 'surge').map(r => r.name);
  const note = 'Top ' + sl.rows.length + ' seller chiếm ' + sl.topShare.toFixed(2) + '% tổng đền bù ' + w.label + ', các seller còn lại chiếm ' + (100 - sl.topShare).toFixed(2) + '%.' +
    (hot.length ? ' ' + hot.slice(0, 3).join(', ') + ' tăng mạnh so với nền 4 tuần trước, nên làm việc với seller này trước.' : '');
  return '<section id="sec-seller' + sfx + '"><h2>Seller tập trung và cảnh báo tăng đột biến</h2><div class="underline"></div>' +
    '<p class="desc">Top ' + sl.rows.length + ' seller của ' + esc(w.label) + ': tỷ trọng, lũy kế và mức thay đổi so với trung bình 4 tuần trước. Seller tăng từ ' + th.sellerSurgePct + '% và đền bù từ ' + fmtMoney(th.sellerMinValue) + ' bị gắn cờ.</p>' +
    '<div class="table-wrap"><table class="tbl-heat"><thead><tr><th>Seller</th><th>Account</th><th>Số đơn</th><th>Đền bù</th><th>% tổng tuần</th><th>Lũy kế %</th><th>So với TB 4 tuần</th><th>Cảnh báo</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="sec-note">' + esc(note) + '</div></section>';
}

function heatTable(title, rows, labels, withVung) {
  if (!rows.length) return '<div class="desc">Không có dữ liệu.</div>';
  let max = 0;
  rows.forEach(r => r.vals.forEach(v => { if (v > max) max = v; }));
  const head = '<tr><th>' + esc(title) + '</th>' + (withVung ? '<th>Vùng</th>' : '') +
    labels.map((l, i) => '<th class="' + (i === labels.length - 1 ? 'cur' : '') + '">' + esc(l.replace('-20', '-')) + '</th>').join('') + '<th>So với tuần trước</th></tr>';
  const body = rows.map(r => {
    const chip = r.streak >= 2 ? '<span class="chip">Tăng ' + r.streak + ' tuần liền</span>' : '';
    return '<tr><td title="' + esc(r.name) + '">' + esc(r.name) + chip + '</td>' + (withVung ? '<td>' + esc(r.vung) + '</td>' : '') +
      r.vals.map((v, i) => '<td class="' + heatClass(v, max) + (i === r.vals.length - 1 ? ' cur' : '') + '">' + mil(v) + '</td>').join('') + '<td>' + momHtml(r.pct) + '</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table class="tbl-heat"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
}

function khoSection(d, sfx) {
  sfx = sfx || '';
  const dp = d.deep;
  return '<section id="sec-kho' + sfx + '"><h2>Kho và vùng chịu trách nhiệm theo 6 tuần</h2><div class="underline"></div>' +
    '<p class="desc">Đơn vị: triệu đồng. Ô càng đậm là đền bù càng lớn trong bảng, cột vàng là tuần đang xem. Nhãn "Tăng N tuần liền" xuất hiện khi đền bù tăng từ 2 tuần liên tiếp.</p>' +
    '<h3>Kho chịu trách nhiệm</h3>' + heatTable('Kho', dp.kho, dp.labels, true) +
    '<h3>Vùng chịu trách nhiệm</h3>' + heatTable('Vùng', dp.vung, dp.labels, false) + '</section>';
}

function outTrendSection(d, sfx) {
  sfx = sfx || '';
  const ot = d.deep.outTrend, w = d.week, acc = d.deep.outAcc, last = ot[ot.length - 1];
  let streak = 0;
  for (let k = ot.length - 1; k > 0; k--) {
    if (ot[k].count > ot[k - 1].count) streak++;
    else break;
  }
  const kpis = '<div class="kpis">' +
    '<div class="kpi"><div class="label">Tỷ trọng giá trị</div><div class="value">' + last.share.toFixed(2) + '%</div><div class="sub">' + fmtMoney(last.val) + ' / ' + fmtMoney(last.den) + '</div></div>' +
    '<div class="kpi"><div class="label">Tỷ trọng số đơn</div><div class="value">' + last.countShare.toFixed(2) + '%</div><div class="sub">' + fmtNum(last.count) + ' / ' + fmtNum(last.n) + ' đơn</div></div>' +
    '<div class="kpi"><div class="label">Theo account</div><div class="value">SPB ' + fmtNum(acc.SPB) + ' · SPE ' + fmtNum(acc.SPE) + '</div><div class="sub">Số đơn bất thường ' + esc(w.label) + '</div></div></div>';
  const bars = trendBars(ot.map(x => ({label: x.label, den: x.count, selected: x.selected})), 'Cột cam: tuần đang xem. Mỗi cột là số đơn bất thường của tuần.');
  const rows = ot.map(x =>
    '<tr><td>' + esc(x.label) + (x.selected ? ' (đang xem)' : '') + '</td><td>' + fmtNum(x.count) + '</td><td>' + fmtMoney(x.val) + '</td><td>' + x.share.toFixed(2) + '%</td><td>' + x.countShare.toFixed(2) + '%</td><td>' + fmtMoney(x.thr) + '</td></tr>').join('');
  const note = streak >= 2
    ? 'Số đơn bất thường tăng ' + streak + ' tuần liền (từ ' + ot[ot.length - 1 - streak].count + ' lên ' + last.count + ').'
    : 'Số đơn bất thường chưa có xu hướng tăng liên tiếp từ 2 tuần.';
  return '<section id="sec-out' + sfx + '"><h2>Đơn bất thường theo tuần</h2><div class="underline"></div>' +
    '<p class="desc">Mỗi tuần dùng ngưỡng riêng: trung bình + ' + d.thresholds.outlierSigma + ' độ lệch chuẩn của chính tuần đó. Danh sách và nút tải đủ các đơn của tuần đang xem nằm ở mục "Đơn có giá trị bất thường" trong Tổng quan.</p>' +
    kpis + '<h3>Số đơn bất thường 6 tuần</h3>' + bars +
    '<div class="table-wrap"><table class="tbl-heat"><thead><tr><th>Tuần</th><th>Số đơn bất thường</th><th>Giá trị</th><th>Tỷ trọng giá trị</th><th>Tỷ trọng số đơn</th><th>Ngưỡng mỗi đơn</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="sec-note">' + esc(note) + '</div></section>';
}

function leadSection(d, sfx) {
  sfx = sfx || '';
  const ld = d.deep.lead, th = d.thresholds, w = d.week;
  const row = (r, bold) =>
    '<tr' + (bold ? ' style="font-weight:700;"' : '') + '><td>' + esc(r.name) + '</td><td>' + fmtNum(r.n) + '</td><td>' + (r.avg === null ? '—' : fmt1(r.avg)) + '</td><td>' +
    (r.median === null ? '—' : fmt1(r.median)) + '</td><td>' + (r.p90 === null ? '—' : fmt1(r.p90)) + '</td><td>' + (r.n ? r.over.toFixed(1) + '%' : '—') + '</td><td>' + deltaDays(r.delta) + '</td></tr>';
  const all = ld.valid + ld.invalid;
  const note = all
    ? 'Tính từ ngày hẹn lấy đến ngày duyệt eform (theo ngày). ' + fmtNum(ld.valid) + '/' + fmtNum(all) + ' đơn có ngày hẹn lấy hợp lệ, ' + fmtNum(ld.invalid) + ' đơn thiếu hoặc lệch ngày không được tính.'
    : 'Không có đơn nào trong tuần.';
  return '<section id="sec-lead' + sfx + '"><h2>Thời gian xử lý đền bù</h2><div class="underline"></div>' +
    '<p class="desc">Số ngày từ lúc hẹn lấy đến lúc duyệt đền bù của ' + esc(w.label) + ' theo loại yêu cầu. So sánh với tuần trước; số ngày tăng là đỏ, giảm là xanh.</p>' +
    '<div class="table-wrap"><table class="tbl-heat"><thead><tr><th>Loại yêu cầu</th><th>Số đơn</th><th>TB (ngày)</th><th>Trung vị</th><th>P90</th><th>% trên ' + th.lead.overDays + ' ngày</th><th>So với tuần trước</th></tr></thead><tbody>' +
    row(ld.total, true) + ld.rows.map(r => row(r, false)).join('') + '</tbody></table></div>' +
    '<div class="sec-note">' + esc(note) + '</div></section>';
}

let RP_SEQ = 0;

function repeatSection(d, sfx) {
  sfx = sfx || '';
  const rp = d.deep.repeat, labels = d.deep.labels, th = d.thresholds;
  const lblCells = (cls) => labels.map((l, i) => '<th class="' + (i === labels.length - 1 ? 'cur' : '') + '">' + esc(l.replace('-20', '-')) + '</th>').join('');
  const head = '<tr><th>Seller</th>' + lblCells() + '<th>Số tuần trong top ' + th.repeat[0] + '</th><th class="txtl">Lý do lớn nhất (6 tuần)</th><th>Trạng thái</th></tr>';
  let max = 0;
  rp.forEach(r => r.vals.forEach(v => { if (v > max) max = v; }));
  const subRows = (title, rows, id) => rows.length
    ? '<tr class="sub-row sub-head" data-p="' + id + '" style="display:none;"><td colspan="10">' + esc(title) + '</td></tr>' +
      rows.map(x => '<tr class="sub-row" data-p="' + id + '" style="display:none;"><td title="' + esc(x.name) + '">' + esc(x.name) + '</td>' +
        x.vals.map((v, i) => '<td class="' + (i === x.vals.length - 1 ? 'cur' : '') + '">' + mil(v) + '</td>').join('') +
        '<td colspan="3" class="txtl">Tổng 6 tuần ' + mil(x.tot) + ' triệu · ' + x.share.toFixed(1) + '% của seller</td></tr>').join('')
    : '';
  const body = rp.map(r => {
    const id = 'rp' + (RP_SEQ++);
    const main = r.main ? esc(r.main.name) + ' <span class="mom-flat">(' + r.main.share.toFixed(0) + '%)</span>' : '—';
    return '<tr><td title="' + esc(r.name) + '"><button class="warn-toggle" type="button" data-target="' + id + '">+</button>' + esc(r.name) + '</td>' +
      r.vals.map((v, i) => '<td class="' + (r.inTop[i] ? heatClass(v, max) : 'mutedv') + (i === r.vals.length - 1 ? ' cur' : '') + '">' + mil(v) + '</td>').join('') +
      '<td>' + r.weeks + '/6</td><td class="txtl">' + main + '</td><td>' + (r.status === 'repeat' ? '<span class="badge">Lặp lại</span>' : '<span class="badge warn">Theo dõi</span>') + '</td></tr>' +
      subRows('Theo loại yêu cầu', r.byLo, id) + subRows('Theo sản phẩm (san_pham_vn)', r.byRt, id);
  }).join('');
  return '<section id="sec-repeat' + sfx + '"><h2>Seller xuất hiện nhiều tuần liên tiếp</h2><div class="underline"></div>' +
    '<p class="desc">Seller nằm trong top ' + th.repeat[0] + ' đền bù từ ' + th.repeat[1] + '/6 tuần trở lên bị gắn "Lặp lại", từ ' + th.repeat[2] + '/6 tuần là "Theo dõi". Bấm (+) để xem seller đó bị đền theo loại yêu cầu và theo sản phẩm. Đơn vị: triệu đồng; ô xám là tuần seller không nằm trong top.</p>' +
    (rp.length
      ? '<div class="table-wrap"><table class="tbl-heat"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
      : '<p class="desc">Chưa có seller nào nằm trong top ' + th.repeat[0] + ' từ ' + th.repeat[2] + '/6 tuần.</p>') + '</section>';
}

function matrixSection(d, sfx) {
  sfx = sfx || '';
  const mx = d.deep.matrix, w = d.week;
  if (!mx.rows.length) return '';
  let max = 0;
  mx.rows.forEach(r => r.cells.concat([r.other]).forEach(v => { if (v > max) max = v; }));
  const head = '<tr><th>Seller</th>' + mx.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '<th>Khác</th><th>Tổng</th><th class="txtl">Lý do lớn nhất</th></tr>';
  const body = mx.rows.map(r =>
    '<tr><td title="' + esc(r.name) + '">' + esc(r.name) + '</td>' +
    r.cells.concat([r.other]).map(v => '<td class="' + heatClass(v, max) + '">' + mil(v) + '</td>').join('') +
    '<td>' + mil(r.total) + '</td><td class="txtl">' + (r.main ? esc(r.main.name) + ' <span class="mom-flat">(' + r.main.share.toFixed(0) + '%)</span>' : '—') + '</td></tr>').join('');
  return '<section id="sec-matrix' + sfx + '"><h2>Seller × loại yêu cầu</h2><div class="underline"></div>' +
    '<p class="desc">Top ' + mx.rows.length + ' seller của ' + esc(w.label) + ' và đền bù theo từng loại yêu cầu (triệu đồng). Ô càng đậm là đền bù càng lớn, giúp thấy seller bị đền chủ yếu vì lý do nào để chọn hướng xử lý phù hợp.</p>' +
    '<div class="table-wrap"><table class="tbl-heat"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></section>';
}

let INSIGHT_FACETS = null;
let insightFacetsLoading = false;
let insightGlobalWired = false;
let insightOpenKey = null;
const INSIGHT_TIP = 'Chọn bộ lọc (bấm vào từng ô, có thể chọn nhiều giá trị mỗi loại), tuỳ chỉnh khoảng thời gian và mốc thời gian, rồi tải báo cáo Excel đầy đủ: Tổng quan, theo tháng, theo loại yêu cầu, theo kênh WH/MP, theo mức hư hỏng, theo nhóm hàng/mặt hàng, theo seller, theo nguồn — tất cả bằng công thức tham chiếu sheet Data, kèm biểu đồ.';
const INSIGHT_FILTERS = [
  {key: 'khach_hang', label: 'Khách hàng', param: 'khachHangs'},
  {key: 'loai_yeu_cau', label: 'Loại yêu cầu', param: 'loaiYeuCau'},
  {key: 'seller', label: 'Seller', param: 'sellers'},
  {key: 'nhom_hang', label: 'Nhóm hàng', param: 'groups'},
  {key: 'san_pham_vn', label: 'Sản phẩm (VN)', param: 'items'},
  {key: 'san_pham_en', label: 'Sản phẩm (EN)', param: 'sanPhams'},
];
const insightSelected = {};
const insightDraft = {};
INSIGHT_FILTERS.forEach(f => { insightSelected[f.key] = new Set(); insightDraft[f.key] = new Set(); });

function insightSection() {
  return '<section><h2 title="' + esc(INSIGHT_TIP) + '" style="cursor:help;">Insight đền bù theo mặt hàng ⓘ</h2><div class="underline"></div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px;">' +
    '<div><label style="display:block;color:var(--muted);font-size:12px;margin-bottom:4px;">Mốc thời gian</label>' +
    '<select id="inDateField" style="color:var(--navy);background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;">' +
    '<option value="tao">Thời gian tạo đơn</option><option value="hen_lay">Thời gian hẹn lấy</option><option value="eform">Ngày duyệt eform</option></select></div>' +
    '<div><label style="display:block;color:var(--muted);font-size:12px;margin-bottom:4px;">Từ ngày</label>' +
    '<input type="date" id="inFrom" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;"></div>' +
    '<div><label style="display:block;color:var(--muted);font-size:12px;margin-bottom:4px;">Đến ngày</label>' +
    '<input type="date" id="inTo" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;"></div>' +
    '<button class="btn primary" type="button" id="inDownload">⬇ Tải Excel</button>' +
    '</div>' +
    '<div id="inFilterBar" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;"></div>' +
    '<p class="foot" id="inStatus" style="text-align:left;"></p>' +
    '<div id="inPreview" style="border-top:1px dashed var(--border);padding-top:16px;margin-top:4px;"></div></section>';
}

function fmtVnd(n) {
  return Math.round(n).toLocaleString('vi-VN') + ' đ';
}

const INSIGHT_FACET_KEY = {
  khach_hang: 'khachHangs', loai_yeu_cau: 'loaiYeuCau', seller: 'sellers',
  nhom_hang: 'groups', san_pham_vn: 'items', san_pham_en: 'sanPhams',
};

function insightOptionsFor(key) {
  if (!INSIGHT_FACETS) return [];
  return INSIGHT_FACETS[INSIGHT_FACET_KEY[key]] || [];
}

function insightSelParams() {
  const qs = [];
  INSIGHT_FILTERS.forEach(f => {
    const vals = [...insightSelected[f.key]];
    if (vals.length) qs.push(f.param + '=' + encodeURIComponent(vals.join('\u0001')));
  });
  const from = document.getElementById('inFrom').value;
  const to = document.getElementById('inTo').value;
  if (from) qs.push('from=' + encodeURIComponent(from));
  if (to) qs.push('to=' + encodeURIComponent(to));
  qs.push('dateField=' + encodeURIComponent(document.getElementById('inDateField').value));
  return qs;
}

function fetchInsightFacets() {
  const crf = (window.CRData && window.CRData.fetch) || (window.top && window.top.CRData && window.top.CRData.fetch) || fetch;
  const qs = insightSelParams();
  return crf('/api/insight-report?action=facets&' + qs.join('&'), {credentials: 'include', cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function insightLabelHtml(key) {
  const names = [...insightSelected[key]];
  if (!names.length) return '<span class="v all">Tất cả</span>';
  const extra = names.length - 1;
  return '<span class="v">' + esc(names[0]) + '</span>' + (extra > 0 ? '<span class="in-count">+' + extra + '</span>' : '');
}

function renderInsightBar() {
  const bar = document.getElementById('inFilterBar');
  if (!bar) return;
  bar.innerHTML = INSIGHT_FILTERS.map(f =>
    '<div style="position:relative;display:inline-block;">' +
    '<button type="button" class="in-fbtn" data-k="' + f.key + '"><span class="in-k">' + esc(f.label) + ':</span>' + insightLabelHtml(f.key) + '<span class="in-car">▾</span></button>' +
    '<div class="in-panel" id="inPanel-' + f.key + '"></div></div>'
  ).join('');
  bar.querySelectorAll('.in-fbtn').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    toggleInsightPanel(b.dataset.k, b);
  }));
  bar.querySelectorAll('.in-panel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
  updateInsightSummary();
}

function updateInsightSummary() {
  const st = document.getElementById('inStatus');
  if (!st) return;
  const parts = INSIGHT_FILTERS.filter(f => insightSelected[f.key].size).map(f => f.label + ' (' + insightSelected[f.key].size + ')');
  st.textContent = parts.length ? 'Đang lọc theo: ' + parts.join(' · ') : 'Chưa áp dụng bộ lọc nào — báo cáo sẽ gồm toàn bộ phạm vi SPE + SPB.';
}

function closeAllInsightPanels() {
  document.querySelectorAll('.in-panel').forEach(p => p.classList.remove('show'));
  document.querySelectorAll('.in-fbtn').forEach(b => b.classList.remove('open'));
  insightOpenKey = null;
}

function toggleInsightPanel(key, btn) {
  if (insightOpenKey === key) { closeAllInsightPanels(); return; }
  closeAllInsightPanels();
  insightOpenKey = key;
  btn.classList.add('open');
  insightDraft[key] = new Set(insightSelected[key]);
  const panel = document.getElementById('inPanel-' + key);
  panel.classList.add('show');
  panel.innerHTML = '<div class="in-empty">Đang tải...</div>';
  insightFacetsLoading = true;
  fetchInsightFacets()
    .then(facets => {
      INSIGHT_FACETS = facets;
      if (insightOpenKey !== key) return;
      renderInsightPanel(key, '');
      const input = panel.querySelector('input[type=search]');
      if (input) setTimeout(() => input.focus(), 0);
    })
    .catch(() => {
      if (insightOpenKey === key) panel.innerHTML = '<div class="in-empty">Không tải được danh sách, thử lại.</div>';
    })
    .finally(() => { insightFacetsLoading = false; });
}

function renderInsightPanel(key, query) {
  const panel = document.getElementById('inPanel-' + key);
  if (!panel) return;
  const q = query.trim().toLowerCase();
  const items = insightOptionsFor(key).filter(it => !q || it.name.toLowerCase().includes(q));
  panel.innerHTML =
    '<input type="search" placeholder="Tìm kiếm..." value="' + esc(query) + '">' +
    '<div class="in-quick"><a data-act="all">Chọn tất cả (' + items.length + ')</a><a data-act="none">Bỏ chọn tất cả</a></div>' +
    '<div class="in-list">' + (items.length
      ? items.map(it =>
          '<label class="in-row"><input type="checkbox" data-name="' + esc(it.name) + '"' + (insightDraft[key].has(it.name) ? ' checked' : '') + '>' +
          '<span class="in-name">' + esc(it.name) + '<span class="in-meta">' + fmtNum(it.count) + ' đơn, ' + fmtVnd(it.value) + '</span></span></label>'
        ).join('')
      : '<div class="in-empty">Không tìm thấy</div>') + '</div>' +
    '<div class="in-foot"><button type="button" class="in-cancel" data-act="cancel">Huỷ</button><button type="button" class="in-ok" data-act="ok">OK</button></div>';
  panel.querySelector('input[type=search]').addEventListener('input', e => {
    const caret = e.target.selectionStart;
    renderInsightPanel(key, e.target.value);
    const ni = panel.querySelector('input[type=search]');
    ni.focus(); ni.setSelectionRange(caret, caret);
  });
  panel.querySelectorAll('input[type=checkbox]').forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) insightDraft[key].add(cb.dataset.name); else insightDraft[key].delete(cb.dataset.name);
  }));
  panel.querySelector('[data-act="all"]').addEventListener('click', () => { items.forEach(it => insightDraft[key].add(it.name)); renderInsightPanel(key, query); });
  panel.querySelector('[data-act="none"]').addEventListener('click', () => { items.forEach(it => insightDraft[key].delete(it.name)); renderInsightPanel(key, query); });
  panel.querySelector('[data-act="cancel"]').addEventListener('click', () => closeAllInsightPanels());
  panel.querySelector('[data-act="ok"]').addEventListener('click', () => {
    insightSelected[key] = new Set(insightDraft[key]);
    if (key === 'nhom_hang') { insightSelected.san_pham_vn = new Set(); insightSelected.san_pham_en = new Set(); }
    closeAllInsightPanels();
    renderInsightBar();
    refreshInsightPreview();
  });
}

const INSIGHT_RANK_LABELS = {
  groups: 'Nhóm hàng', sellers: 'Seller', loaiYeuCau: 'Loại yêu cầu',
  items: 'Sản phẩm (VN)', sanPhams: 'Sản phẩm (EN)', channels: 'Channel (WH / MP)', contentGroups: 'Nhóm suy ra từ content',
};
let insightPreviewSeq = 0;

function insightRankColHtml(title, items) {
  const max = Math.max.apply(null, items.map(i => i.value).concat([1]));
  return '<div class="in-rankcol"><div class="t">' + esc(title) + '</div>' + (items.length
    ? items.map(it =>
        '<div class="in-rankrow"><div class="nm">' + esc(it.name) + '</div><div class="bar"><i style="width:' + Math.max(2, Math.round(it.value / max * 100)) + '%"></i></div><div class="vv">' + fmtCompact(it.value) + '</div></div>'
      ).join('')
    : '<div style="color:var(--muted);font-size:11.5px;">Không có dữ liệu</div>') + '</div>';
}

function renderInsightPreview(data) {
  const el = document.getElementById('inPreview');
  if (!el) return;
  if (!data.kpi.count) {
    el.innerHTML = '<p class="foot" style="text-align:left;">Không có đơn nào khớp với bộ lọc hiện tại.</p>';
    return;
  }
  const max = Math.max.apply(null, data.trend.map(t => t.value).concat([1]));
  const kpis = '<div class="in-kpis">' +
    '<div class="in-kpi"><div class="l">Tổng số đơn</div><div class="v">' + fmtNum(data.kpi.count) + '</div></div>' +
    '<div class="in-kpi"><div class="l">Tổng giá trị đền bù</div><div class="v orange">' + fmtVnd(data.kpi.value) + '</div></div>' +
    '<div class="in-kpi"><div class="l">TB / đơn</div><div class="v">' + fmtVnd(data.kpi.avg) + '</div></div>' +
    '<div class="in-kpi"><div class="l">Số seller</div><div class="v">' + fmtNum(data.kpi.sellers) + '</div></div>' +
    '</div>';
  const trend = '<div class="in-trend">' + data.trend.map(t =>
    '<div class="col"><div class="val">' + fmtCompact(t.value) + '</div><div class="bar" style="height:' + Math.max(4, Math.round(t.value / max * 90)) + 'px"></div><div class="lab">' + esc(t.month) + '</div></div>'
  ).join('') + '</div>';
  const rankKeys = ['groups', 'sellers', 'loaiYeuCau', 'items', 'sanPhams', 'channels', 'contentGroups'];
  const ranks = '<div class="in-ranklist">' + rankKeys.map(k => insightRankColHtml(INSIGHT_RANK_LABELS[k], data.rankings[k])).join('') + '</div>';
  el.innerHTML = kpis + trend + ranks;
}

function refreshInsightPreview() {
  const el = document.getElementById('inPreview');
  if (!el) return;
  const seq = ++insightPreviewSeq;
  el.innerHTML = '<p class="foot" style="text-align:left;">Đang tính số liệu xem trước...</p>';
  const crf = (window.CRData && window.CRData.fetch) || (window.top && window.top.CRData && window.top.CRData.fetch) || fetch;
  const qs = insightSelParams();
  crf('/api/insight-report?action=preview&' + qs.join('&'), {credentials: 'include', cache: 'no-store'})
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => { if (seq === insightPreviewSeq) renderInsightPreview(data); })
    .catch(() => { if (seq === insightPreviewSeq) el.innerHTML = '<p class="foot" style="text-align:left;">Không tải được số liệu xem trước.</p>'; });
}

function wireInsight() {
  const btn = document.getElementById('inDownload');
  const st = document.getElementById('inStatus');
  if (!btn) return;
  if (!insightGlobalWired) {
    insightGlobalWired = true;
    document.addEventListener('click', () => closeAllInsightPanels());
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllInsightPanels(); });
  }
  document.getElementById('inFrom').addEventListener('change', refreshInsightPreview);
  document.getElementById('inTo').addEventListener('change', refreshInsightPreview);
  document.getElementById('inDateField').addEventListener('change', refreshInsightPreview);
  btn.addEventListener('click', () => {
    const qs = insightSelParams();
    btn.disabled = true;
    const prevText = btn.textContent;
    btn.textContent = 'Đang tạo file...';
    if (st) st.textContent = 'Đang tổng hợp và tạo file Excel (có thể mất vài giây)...';
    const crf = (window.CRData && window.CRData.fetch) || (window.top && window.top.CRData && window.top.CRData.fetch) || fetch;
    crf('/api/insight-report?' + qs.join('&'), {credentials: 'include', cache: 'no-store'})
      .then(r => {
        if (!r.ok) return r.json().catch(() => ({})).then(j => { throw new Error(j.error || ('HTTP ' + r.status)); });
        const cd = r.headers.get('Content-Disposition') || '';
        const m = /filename="([^"]+)"/.exec(cd);
        return r.blob().then(b => ({ blob: b, filename: m ? m[1] : 'Insight.xlsx' }));
      })
      .then(({blob, filename}) => {
        saveBlob(blob, filename);
        updateInsightSummary();
      })
      .catch(e => {
        if (st) st.textContent = 'Không tạo được file: ' + (e.message || 'lỗi không xác định') + '. Thử lại.';
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = prevText;
      });
  });
  renderInsightBar();
  if (VIEW === 'in') refreshInsightPreview();
}

function deepHtml(d, sfx) {
  sfx = sfx || '';
  return sellersSection(d, sfx) + matrixSection(d, sfx) + khoSection(d, sfx) + outTrendSection(d, sfx) + leadSection(d, sfx) + repeatSection(d, sfx);
}

function wireViews() {
  document.querySelectorAll('.vtab').forEach(b => b.addEventListener('click', () => {
    VIEW = b.dataset.v;
    document.querySelectorAll('.vtab').forEach(x => x.classList.toggle('active', x === b));
    document.getElementById('viewTq').classList.toggle('hide', VIEW !== 'tq');
    document.getElementById('viewCs').classList.toggle('hide', VIEW !== 'cs');
    document.getElementById('viewIn').classList.toggle('hide', VIEW !== 'in');
    document.getElementById('vjump').classList.toggle('show', VIEW === 'cs');
    window.scrollTo(0, 0);
    if (VIEW === 'in' && !document.getElementById('inPreview').childElementCount) refreshInsightPreview();
  }));
  document.querySelectorAll('#vjump button').forEach(b => b.addEventListener('click', () => {
    const el = document.getElementById(b.dataset.j);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  }));
}

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('.warn-toggle');
  if (!b) return;
  const open = b.textContent === '+';
  document.querySelectorAll('tr[data-p="' + b.dataset.target + '"]').forEach(r => { r.style.display = open ? 'table-row' : 'none'; });
  b.textContent = open ? '−' : '+';
});

    setControlsVisible(false);
    document.getElementById('app').innerHTML = '<div class="loading">Nguồn dữ liệu chưa có dòng nào để tổng hợp' + (isHL ? ' theo hẹn lấy' : '') + '.</div>' +
      '<div style="text-align:center;"><button class="btn" type="button" id="btnSwitchBasis0">⇄ Đổi mốc thời gian</button></div>';

function mdTable(headers, rows) {
  if (!rows.length) return '';
  return '| ' + headers.join(' | ') + ' |\n|' + headers.map(() => '---').join('|') + '|\n' +
    rows.map(r => '| ' + r.map(c => String(c).replace(/\|/g, '/')).join(' | ') + ' |').join('\n') + '\n\n';
}
function mdPct(p, it) {
  if (it && it.prev === 0 && it.cur > 0) return 'Mới';
  if (p === null || p === undefined || !isFinite(p)) return '—';
  return (p > 0 ? '▲ ' : p < 0 ? '▼ ' : '') + Math.abs(p).toFixed(2) + '%';
}
function mdDim(title, items, cols) {
  return mdTable([title, cols[0], cols[1], 'Biến động', 'Tỷ trọng'],
    (items || []).map(it => [it.name, fmtMoney(it.cur), fmtMoney(it.prev), mdPct(it.pct, it), it.share.toFixed(1) + '%']));
}

function buildMarkdown(d, basis) {
  const isHL = basis === 'hen_lay';
  const w = d.week, m = d.month;
  const weekCols = [w.label, w.total.prevLabel];
  const monthCols = m.mode === 'mtd' ? ['Lũy kế ' + m.label, 'Cùng kỳ ' + m.prevLabel] : [m.label, m.prevLabel];
  let md = '# TỔNG HỢP ĐỀN BÙ (' + (isHL ? 'THEO HẸN LẤY' : 'THEO DUYỆT EFORM') + ') — TUẦN ' + w.label + ' & THÁNG ' + m.label + '\n\n';
  md += isHL
    ? '_Tuần ' + w.start + ' → ' + w.end + ' (thứ 2 → Chủ nhật, theo ngày hẹn lấy) · dữ liệu hẹn lấy đến ' + d.dataThrough + ' · tổng hợp lúc ' + d.generatedAt + ' · phạm vi SPE + SPB_\n\n'
    : '_Tuần ' + w.start + ' → ' + w.end + ' (thứ 4 → thứ 3), đền bù duyệt eform từ ' + w.approveFrom + ' · dữ liệu duyệt đến ' + d.dataThrough + ' · tổng hợp lúc ' + d.generatedAt + ' · phạm vi SPE + SPB_\n\n';
  md += '## Chỉ số chính\n\n';
  md += '- **Đền bù ' + w.label + ':** ' + fmtMoney(w.total.cur) + ' (' + mdPct(w.total.pct) + ' so với ' + w.total.prevLabel + ': ' + fmtMoney(w.total.prev) + ')\n';
  md += '- **Số đơn ' + w.label + ':** ' + fmtNum(w.total.n) + '\n';
  md += '- **Trung bình 4 tuần trước:** ' + fmtMoney(w.total.avg4) + ' (' + w.label + ' ' + mdPct(w.total.pctAvg4) + ')\n';
  md += '- **Đền bù ' + (m.mode === 'mtd' ? 'lũy kế ' : '') + m.label + ':** ' + fmtMoney(m.total.cur) + ' (' + mdPct(m.total.pct) + ' so với ' + (m.mode === 'mtd' ? 'cùng kỳ ' : '') + m.prevLabel + ': ' + fmtMoney(m.total.prev) + ')\n';
  md += '- **Số đơn ' + m.label + ':** ' + fmtNum(m.total.n) + '\n\n';
  md += '## Chỉ số cần lưu ý\n\n';
  md += d.flags.length ? d.flags.map(f => '- **[' + levelName(f.level) + '] ' + f.area + ':** ' + f.title + ' — ' + f.detail).join('\n') + '\n\n' : '_Không có chỉ số vượt ngưỡng._\n\n';
  md += '## Đề xuất\n\n' + d.suggestions.map(s => '- **[' + levelName(s.level) + ']** ' + s.text).join('\n') + '\n\n';
  const order = [['acc', 'Account'], ['ch', 'Kênh'], ['lo', 'Loại yêu cầu'], ['ng', 'Nhóm ngành'], ['rt', 'Sản phẩm'], ['tu', 'Tuyến'], ['vu', 'Vùng'], ['kh', 'Kho'], ['se', 'Seller']];
  md += '## Tuần ' + w.label + '\n\n';
  md += mdTable(['Tuần', 'Khoảng ngày', 'Đền bù', 'Số đơn'], w.trend.map(x => [x.label + (x.selected ? ' (đang xem)' : ''), x.start + ' → ' + x.end + (isHL ? '' : ' (duyệt ' + x.approveFrom + ')'), fmtMoney(x.den), fmtNum(x.n)]));
  order.forEach(p => { md += '### ' + p[1] + '\n\n' + mdDim(p[1], w.dims[p[0]], weekCols); });
  md += '## Tháng ' + m.label + '\n\n';
  md += mdTable(['Tháng', 'Đền bù', 'Số đơn'], m.trend.map(x => [x.label + (x.selected ? ' (đang xem)' : ''), fmtMoney(x.den), fmtNum(x.n)]));
  order.forEach(p => { md += '### ' + p[1] + '\n\n' + mdDim(p[1], m.dims[p[0]], monthCols); });
  const dp = d.deep;
  md += '## Chuyên sâu\n\n';
  md += '### Seller tập trung\n\n' + mdTable(['Seller', 'Account', 'Số đơn', 'Đền bù', '% tổng tuần', 'Lũy kế %', 'So với TB 4 tuần', 'Cảnh báo'],
    dp.sellers.rows.map(r => [r.name, r.acc, fmtNum(r.n), fmtMoney(r.cur), r.share.toFixed(2) + '%', r.cum.toFixed(2) + '%', r.pct === null ? 'Mới' : mdPct(r.pct), r.flag === 'surge' ? 'Tăng đột biến' : r.flag === 'new' ? 'Mới phát sinh' : '']));
  const heatMd = (title, rows, withVung) => mdTable([title].concat(withVung ? ['Vùng'] : [], dp.labels, ['So với tuần trước']),
    rows.map(r => [r.name + (r.streak >= 2 ? ' (tăng ' + r.streak + ' tuần liền)' : '')].concat(withVung ? [r.vung] : [], r.vals.map(v => mil(v)), [mdPct(r.pct)])));
  md += '### Kho chịu trách nhiệm theo 6 tuần (triệu đồng)\n\n' + heatMd('Kho', dp.kho, true);
  md += '### Vùng chịu trách nhiệm theo 6 tuần (triệu đồng)\n\n' + heatMd('Vùng', dp.vung, false);
  md += '### Đơn bất thường theo tuần\n\n' + mdTable(['Tuần', 'Số đơn bất thường', 'Giá trị', 'Tỷ trọng giá trị', 'Tỷ trọng số đơn', 'Ngưỡng mỗi đơn'],
    dp.outTrend.map(x => [x.label + (x.selected ? ' (đang xem)' : ''), fmtNum(x.count), fmtMoney(x.val), x.share.toFixed(2) + '%', x.countShare.toFixed(2) + '%', fmtMoney(x.thr)]));
  const leadMd = r => [r.name, fmtNum(r.n), r.avg === null ? '—' : fmt1(r.avg), r.median === null ? '—' : fmt1(r.median), r.p90 === null ? '—' : fmt1(r.p90), r.n ? r.over.toFixed(1) + '%' : '—', r.delta === null ? '—' : (r.delta > 0 ? '+' : '') + fmt1(r.delta) + ' ngày'];
  md += '### Thời gian xử lý đền bù (ngày hẹn lấy → ngày duyệt)\n\n' + mdTable(['Loại yêu cầu', 'Số đơn', 'TB (ngày)', 'Trung vị', 'P90', '% trên ' + d.thresholds.lead.overDays + ' ngày', 'So với tuần trước'],
    [leadMd(dp.lead.total)].concat(dp.lead.rows.map(leadMd)));
  md += '_' + fmtNum(dp.lead.valid) + '/' + fmtNum(dp.lead.valid + dp.lead.invalid) + ' đơn có ngày hẹn lấy hợp lệ._\n\n';
  md += '### Seller × loại yêu cầu (triệu đồng)\n\n' + mdTable(['Seller'].concat(dp.matrix.cols, ['Khác', 'Tổng', 'Lý do lớn nhất']),
    dp.matrix.rows.map(r => [r.name].concat(r.cells.map(v => mil(v)), [mil(r.other), mil(r.total), r.main ? r.main.name + ' (' + r.main.share.toFixed(0) + '%)' : '—'])));
  md += '### Seller xuất hiện nhiều tuần liên tiếp (triệu đồng)\n\n' + (dp.repeat.length
    ? mdTable(['Seller'].concat(dp.labels, ['Số tuần trong top ' + d.thresholds.repeat[0], 'Lý do lớn nhất (6 tuần)', 'Trạng thái']),
        dp.repeat.map(r => [r.name].concat(r.vals.map(v => mil(v)), [r.weeks + '/6', r.main ? r.main.name + ' (' + r.main.share.toFixed(0) + '%)' : '—', r.status === 'repeat' ? 'Lặp lại' : 'Theo dõi']))) +
      dp.repeat.map(r => '- **' + r.name + '**: loại yêu cầu ' + r.byLo.slice(0, 3).map(x => x.name + ' ' + x.share.toFixed(0) + '%').join(', ') + '; sản phẩm ' + r.byRt.slice(0, 3).map(x => x.name + ' ' + x.share.toFixed(0) + '%').join(', ')).join('\n') + '\n\n'
    : '_Chưa có seller nào nằm trong top từ ' + d.thresholds.repeat[2] + '/6 tuần._\n\n');
  md += '## Đơn có giá trị bất thường — ' + w.label + '\n\n';
  md += d.outliers.list.length
    ? mdTable(['Mã đơn', isHL ? 'Ngày hẹn lấy' : 'Ngày duyệt', 'Account', 'Seller', 'Loại yêu cầu', 'Giá trị'], d.outliers.list.slice(0, 50).map(x => [x.ma, x.ngay, x.acc, x.seller, x.loai, fmtMoney(x.den)])) +
      (d.outliers.list.length > 50 ? '_Hiển thị 50 trên ' + d.outliers.list.length + ' đơn; xem đủ trong file Excel hoặc CSV tải từ trang._\n\n' : '')
    : '_Không có đơn vượt ngưỡng._\n\n';
  return md;
}

function outCols(dateLabel) {
  return [
    ['Mã đơn', 'ma', 14], [dateLabel, 'ngay', 17], ['Account', 'acc', 10], ['Seller', 'seller', 30], ['Kênh', 'kenh', 8],
    ['Loại yêu cầu', 'loai', 24], ['Nhóm ngành', 'ng', 28], ['Sản phẩm', 'rt', 32], ['Tuyến', 'tu', 18],
    ['Kho chịu trách nhiệm', 'kh', 30], ['Vùng', 'vu', 12], ['Giá trị đền bù (đ)', 'den', 18]
  ];
}
const OUT_COLS = outCols('Ngày duyệt eform');
const OUT_COLS_HL = outCols('Ngày hẹn lấy');

function outFiltered(state) {
  state = state || OUT;
  const q = state.q.trim().toLowerCase();
  if (!q) return state.list;
  return state.list.filter(x => [x.ma, x.seller, x.loai, x.acc, x.kh, x.ng, x.rt, x.tu, x.vu, x.kenh].join(' ').toLowerCase().indexOf(q) >= 0);
}

function renderOutlierRows(state, sfx) {
  state = state || OUT;
  sfx = sfx || '';
  const body = document.getElementById('outBody' + sfx);
  if (!body) return;
  const list = outFiltered(state);
  const filtering = state.q.trim() !== '';
  const shown = state.expanded || filtering ? list : list.slice(0, 10);
  body.innerHTML = shown.length
    ? shown.map(x => '<tr><td>' + esc(x.ma) + '</td><td>' + esc(x.ngay) + '</td><td>' + esc(x.acc) + '</td><td>' + esc(x.seller) + '</td><td>' + esc(x.loai) + '</td><td>' + fmtMoney(x.den) + '</td></tr>').join('')
    : '<tr><td colspan="6" class="mom-flat" style="text-align:center;">Không có đơn nào khớp</td></tr>';
  const total = state.list.length;
  document.getElementById('outCount' + sfx).textContent = filtering
    ? 'Khớp ' + list.length + '/' + total + ' đơn'
    : 'Đang hiển thị ' + shown.length + '/' + total + ' đơn' + (shown.length < total ? ' lớn nhất' : '');
  const tg = document.getElementById('outToggle' + sfx);
  tg.style.display = filtering || total <= 10 ? 'none' : '';
  tg.textContent = state.expanded ? 'Thu gọn còn 10 đơn' : 'Xem tất cả ' + total + ' đơn';
  document.getElementById('outXlsx' + sfx).textContent = '⬇ Tải Excel (' + list.length + ' đơn)';
  document.getElementById('outCsv' + sfx).textContent = '⬇ Tải CSV (' + list.length + ' đơn)';
  document.getElementById('outXlsx' + sfx).disabled = !list.length;
  document.getElementById('outCsv' + sfx).disabled = !list.length;
}

function wireOutliers(state, sfx) {
  state = state || OUT;
  sfx = sfx || '';
  const body = document.getElementById('outBody' + sfx);
  if (!body) return;
  document.getElementById('outSearch' + sfx).addEventListener('input', e => { state.q = e.target.value; renderOutlierRows(state, sfx); });
  document.getElementById('outToggle' + sfx).addEventListener('click', () => { state.expanded = !state.expanded; renderOutlierRows(state, sfx); });
  document.getElementById('outCsv' + sfx).addEventListener('click', () => downloadOutliersCsv(state));
  document.getElementById('outXlsx' + sfx).addEventListener('click', () => downloadOutliersXlsx(state));
  renderOutlierRows(state, sfx);
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function outFileName(state, ext) {
  state = state || OUT;
  return 'DonBatThuong_' + state.label + '_' + outFiltered(state).length + 'don.' + ext;
}

function downloadOutliersCsv(state) {
  state = state || OUT;
  const cols = BASIS === 'hen_lay' ? OUT_COLS_HL : OUT_COLS;
  const list = outFiltered(state);
  if (!list.length) return;
  const cell = v => {
    const t = String(v === null || v === undefined ? '' : v);
    return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  const lines = [cols.map(c => cell(c[0])).join(',')];
  list.forEach(x => lines.push(cols.map(c => cell(x[c[1]])).join(',')));
  saveBlob(new Blob(['\uFEFF' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), outFileName(state, 'csv'));
}

const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true);
    lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true);
    ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((s, b) => s + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function xmlText(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function colLetter(i) {
  let s = '';
  i += 1;
  while (i > 0) {
    const m = (i - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function buildXlsx(list, cols) {
  cols = cols || OUT_COLS;
  const head = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const ns = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const lastCol = colLetter(cols.length - 1);
  let rows = '<row r="1">' + cols.map((c, i) => '<c r="' + colLetter(i) + '1" s="1" t="inlineStr"><is><t>' + xmlText(c[0]) + '</t></is></c>').join('') + '</row>';
  list.forEach((x, r) => {
    const rn = r + 2;
    rows += '<row r="' + rn + '">' + cols.map((c, i) => {
      const ref = colLetter(i) + rn;
      if (c[1] === 'den') return '<c r="' + ref + '" s="2"><v>' + (Number(x.den) || 0) + '</v></c>';
      return '<c r="' + ref + '" t="inlineStr"><is><t>' + xmlText(x[c[1]]) + '</t></is></c>';
    }).join('') + '</row>';
  });
  const sheet = head + '<worksheet xmlns="' + ns + '"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
    '<cols>' + cols.map((c, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c[2] + '" customWidth="1"/>').join('') + '</cols>' +
    '<sheetData>' + rows + '</sheetData><autoFilter ref="A1:' + lastCol + (list.length + 1) + '"/></worksheet>';
  const styles = head + '<styleSheet xmlns="' + ns + '"><fonts count="2"><font><sz val="11"/><name val="Cambria"/></font><font><b/><sz val="11"/><name val="Cambria"/></font></fonts>' +
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  const rel = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  return zipStore([
    {name: '[Content_Types].xml', text: head + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name: '_rels/.rels', text: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + rel + '/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name: 'xl/workbook.xml', text: head + '<workbook xmlns="' + ns + '" xmlns:r="' + rel + '"><sheets><sheet name="Đơn bất thường" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name: 'xl/_rels/workbook.xml.rels', text: head + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + rel + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + rel + '/styles" Target="styles.xml"/></Relationships>'},
    {name: 'xl/styles.xml', text: styles},
    {name: 'xl/worksheets/sheet1.xml', text: sheet}
  ]);
}

function downloadOutliersXlsx(state) {
  state = state || OUT;
  const cols = BASIS === 'hen_lay' ? OUT_COLS_HL : OUT_COLS;
  const list = outFiltered(state);
  if (!list.length) return;
  saveBlob(buildXlsx(list, cols), outFileName(state, 'xlsx'));
}

function downloadMd() {
  const d = pickData(BASIS);
  if (!d || d.empty) return;
  const blob = new Blob([buildMarkdown(d, BASIS)], {type: 'text/markdown;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TongHop_DenBu_' + (BASIS === 'hen_lay' ? 'HenLay_' : '') + d.week.label + '_' + d.month.label.replace('/', '-') + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
